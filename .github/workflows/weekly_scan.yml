name: Weekly Abundance Wins Scan

on:
  schedule:
    # Mondays 13:00 UTC (~9am ET / 6am PT)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scan
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.run_weekly

      - name: Commit digest, seen-state, and cost log
        run: |
          git config user.name "abundance-scanner-bot"
          git config user.email "actions@github.com"
          git add digests/ state/seen.sqlite state/cost_log.csv
          git diff --cached --quiet || git commit -m "Weekly Abundance Wins scan: $(date -u +%Y-%m-%d)"
          git push
