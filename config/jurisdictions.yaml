# Curated Legistar client codes for Tier 2 municipal sourcing (src/sources/legistar.py).
#
# `code` is the Legistar client subdomain, i.e. https://{code}.legistar.com and the Web
# API base https://webapi.legistar.com/v1/{code}/. Every entry below was verified live
# against the Web API `bodies` endpoint on 2026-08-05 (returns a JSON array, not an
# "InSite setting not set up" error) — do not add a code without the same check, since
# legistar.com resolves 200 for *any* subdomain regardless of validity.
#
# Starter set: DC-area jurisdictions + a geographically representative national sample,
# per CLAUDE.md's open question ("which ~20-50 cities/counties matter most?"). Expand
# over time — good candidates are places actively passing zoning/permitting/energy-siting
# reform, not just population-largest cities.

dc_area:
  - code: montgomerycountymd
    name: Montgomery County
    state: MD
    type: county
