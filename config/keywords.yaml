# Pre-filter keyword list, tagged by Abundance category.
# Matching is case-insensitive substring/word matching against title + abstract/summary
# text (see src/filter/keyword_filter.py). Keep this list broad early on; tighten based
# on false-positive rate observed from Haiku triage (see CLAUDE.md "Open questions").
#
# A document matches if it contains ANY keyword from ANY category. The matched
# category/categories are attached to the candidate for downstream triage/summary.

